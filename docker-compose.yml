services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks: [faultline]
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env.docker.example
    expose: ["4000"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [faultline]
  mongodb:
    image: mongo:8
    expose: ["27017"]
    volumes: [mongodb-data:/data/db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [faultline]
  redis:
    image: redis:8-alpine
    expose: ["6379"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [faultline]
volumes:
  mongodb-data:
  redis-data:
networks:
  faultline:
    driver: bridge
